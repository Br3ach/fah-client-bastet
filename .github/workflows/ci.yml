name: CPU affinity CI
on:
  push:
    branches: [master, cpu-affinity-v5]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CBANG_HOME: ${{ github.workspace }}/cbang
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # Known companion dependency until the topology PR is merged upstream.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Br3ach/cbang
          ref: d15321f7cfe38e9d00c257a942d4196a3ae04e11
          path: cbang
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-venv
          python3 -m venv .venv
          .venv/bin/pip install scons
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          scons -C cbang -j2
          scons -j2
      - name: Fast regression and native affinity integration
        run: scons -C tests affinity-fast affinity-integration
